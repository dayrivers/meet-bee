<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f2">
  <title>Days since I last Meet Meet Bee</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #432d3b;
      --muted: #876f7d;
      --pink: #f5a9bd;
      --rose: #e8799a;
      --paper: #fffaf8;
      --bg: #f6f4f2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
    }
    body {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: var(--bg);
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      overflow: hidden;
    }
    .background-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.95;
    }
    .background-art svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 64px) 28px;
      text-align: center;
      background: rgb(255 255 255 / 78%);
      border: 1px solid rgb(255 255 255 / 90%);
      border-radius: 32px;
      box-shadow: 0 24px 80px rgb(131 70 95 / 13%);
      backdrop-filter: blur(12px);
    }
    .heart { color: var(--rose); font-size: 30px; animation: beat 1.5s ease-in-out infinite; }
    h1 { margin: 16px 0 10px; font-size: clamp(1.7rem, 6vw, 2.45rem); line-height: 1.15; letter-spacing: -.04em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 1rem; }
    .count {
      margin: 18px 0 0;
      color: var(--rose);
      font-size: clamp(7rem, 34vw, 12rem);
      font-weight: 800;
      line-height: .98;
      letter-spacing: -.085em;
      font-variant-numeric: tabular-nums;
    }
    .unit { margin: 8px 0 28px; color: var(--muted); font-size: 1.15rem; }
    .date-row { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: .9rem; }
    label { font-weight: 650; }
    input[type="date"] {
      padding: 10px 12px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid #f0d7df;
      border-radius: 12px;
      font: inherit;
    }
    .note { min-height: 1.3em; margin: 10px 0 0; color: #aa526e; font-size: .85rem; }
    .sparkle { position: absolute; color: #f2b5c5; font-size: 22px; }
    .one { top: 24px; left: 28px; }.two { right: 30px; bottom: 28px; font-size: 17px; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="background-art" aria-hidden="true">
    <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="900" fill="#f5f4f4"/>

      <g transform="translate(40 30)">
        <g fill="#5f2d1f" stroke="#3a1913" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="360" cy="180" r="78"/>
          <circle cx="760" cy="180" r="78"/>
          <circle cx="700" cy="700" r="66"/>
        </g>

        <g fill="#f7f6f5" stroke="#3a1913" stroke-width="10" stroke-linejoin="round">
          <path d="M325 170c0-180 560-180 560 0v245c0 150-126 272-280 272s-280-122-280-272V170z"/>
          <ellipse cx="520" cy="255" rx="66" ry="82"/>
          <ellipse cx="680" cy="255" rx="66" ry="82"/>
          <path d="M455 490c-35-35-52-80-42-131 26-12 56-15 86-10 40 7 70 28 91 58 33 45 18 107-21 138-43 34-92 42-114-55z"/>
          <path d="M745 490c35-35 52-80 42-131-26-12-56-15-86-10-40 7-70 28-91 58-33 45-18 107 21 138 43 34 92 42 114-55z"/>
        </g>

        <g fill="#f7f6f5" stroke="#3a1913" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <path d="M325 440c-48 56-80 126-82 190-3 80 58 144 154 143 72-1 129-52 147-129 17-74-11-171-69-221-24-21-74-27-150 17z"/>
          <path d="M870 440c48 56 80 126 82 190 3 80-58 144-154 143-72-1-129-52-147-129-17-74 11-171 69-221 24-21 74-27 150 17z"/>
        </g>

        <g fill="#f6d5d9" stroke="#3a1913" stroke-width="8">
          <ellipse cx="515" cy="520" rx="28" ry="20"/>
          <ellipse cx="685" cy="520" rx="28" ry="20"/>
        </g>

        <g fill="#3a1913" stroke="#3a1913" stroke-width="8" stroke-linecap="round">
          <circle cx="500" cy="455" r="12"/>
          <circle cx="700" cy="455" r="12"/>
          <path d="M545 500c24 28 67 28 92 0" fill="none" stroke-width="10"/>
          <path d="M590 528c20 18 40 18 60 0" fill="none" stroke-width="9"/>
        </g>

        <g fill="#e8a9af" stroke="#3a1913" stroke-width="8">
          <circle cx="520" cy="495" r="12"/>
          <circle cx="680" cy="495" r="12"/>
        </g>

        <g fill="#fbe8eb" stroke="#3a1913" stroke-width="8">
          <path d="M600 555c20 28 36 36 56 36s38-9 57-37v34c0 9-8 16-17 17l-40 5-40-5c-9-1-17-8-17-17v-34z"/>
        </g>

        <g fill="#3a1913" stroke="#3a1913" stroke-width="8" stroke-linecap="round">
          <path d="M600 558c12 12 22 18 34 18s22-6 34-18" fill="none"/>
        </g>
      </g>
    </svg>
  </div>

  <main class="card">
    <span class="sparkle one" aria-hidden="true">✦</span>
    <span class="sparkle two" aria-hidden="true">✧</span>
    <div class="heart" aria-hidden="true">♥</div>
    <h1>Days since I last Meet Meet Bee</h1>
    <p class="subtitle">Counting the days until I see my favorite person again</p>
    <div class="count" id="days" aria-live="polite">0</div>
    <p class="unit" id="unit">days</p>
    <div class="date-row">
      <label for="last-met">The last time we met:</label>
      <input id="last-met" type="date" aria-describedby="date-note">
    </div>
    <p class="note" id="date-note">Choose the date you last saw each other to start counting ♡</p>
  </main>
  <script>
    const dateInput = document.querySelector('#last-met');
    const daysOutput = document.querySelector('#days');
    const unitOutput = document.querySelector('#unit');
    const note = document.querySelector('#date-note');
    const storageKey = 'meet-bee-last-met';

    function updateCount() {
      const value = dateInput.value;
      if (!value) {
        daysOutput.textContent = '0';
        unitOutput.textContent = 'days';
        note.textContent = 'Choose the date you last saw each other to start counting ♡';
        return;
      }
      const [year, month, day] = value.split('-').map(Number);
      const lastMet = Date.UTC(year, month - 1, day);
      const today = new Date();
      const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
      const difference = Math.floor((todayUtc - lastMet) / 86_400_000);
      if (difference < 0) {
        daysOutput.textContent = '0';
        unitOutput.textContent = 'days';
        note.textContent = 'That date is in the future—choose the day you last met.';
        return;
      }
      daysOutput.textContent = String(difference);
      unitOutput.textContent = difference === 1 ? 'day' : 'days';
      note.textContent = 'Every day is one day closer to being able to meet meet Bee again♡';
      localStorage.setItem(storageKey, value);
    }

    dateInput.max = new Date().toISOString().slice(0, 10);
    dateInput.value = localStorage.getItem(storageKey) || '';
    dateInput.addEventListener('change', updateCount);
    updateCount();
  </script>
</body>
</html>
